    <radialGradient id="glow">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="220" fill="url(#glow)"/>
  <circle cx="120" cy="280" r="180" fill="#8b5cf6" opacity=".08"/>

  <g opacity=".16" stroke="#94a3b8" stroke-width="1">
