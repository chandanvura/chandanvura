    <rect x="4" y="62" width="44" height="44" rx="11" fill="#0f172a"/>
    <rect x="140" y="62" width="44" height="44" rx="11" fill="#0f172a"/>
    <rect x="276" y="62" width="44" height="44" rx="11" fill="#0f172a"/>
